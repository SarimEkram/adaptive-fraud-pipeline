# Root dev tooling only. Each service and lib has its own pyproject.
[project]
name = "adaptive-fraud-pipeline-dev"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "locust>=2.31", "matplotlib>=3.9"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["libs/fraudcore", "services/scoring", "services/ml-platform", "services/gateway-sim"]
asyncio_mode = "auto"
