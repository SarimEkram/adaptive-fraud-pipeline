[project]
name = "scoring"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fraudcore",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiokafka>=0.11",
    "lightgbm>=4.5",
    "numpy>=1.26",
    "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
