[project]
name = "ml-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fraudcore", "lightgbm>=4.7", "scikit-learn>=1.5", "pandas>=2.2", "pyarrow>=17", "numpy>=1.26", "psycopg[binary]>=3.2", "matplotlib>=3.9"]

[project.scripts]
mlp = "ml_platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
